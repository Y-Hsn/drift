[package]
name = "drift-core"
version = "1.0.0"
edition = "2021"
description = "Drift's music core: plays, keeps the queue going, tray + media keys. No window."

[dependencies]
rodio = { version = "=0.19.0", default-features = false }
symphonia = { version = "=0.5.5", default-features = false, features = ["aac", "isomp4", "mp3", "flac", "ogg", "vorbis", "wav", "pcm", "alac"] }
cpal = "=0.15.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "=0.8.35"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Security", "Win32_Graphics_GdiPlus", "Win32_UI_HiDpi"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
